[org/freedesktop/tracker/miner/files]
index-on-battery=false

[org/gnome/mutter/experimental]
autoclose-xwayland=true

[org/gnome/shell]
disable-user-extensions=false
enabled-extensions=['just-perfection-desktop@just-perfection', 'user-theme@gnome-shell-extensions.gcampax.github.com', 'blur-my-shell@aunetx', 'tilingshell@ferrarodomenico.com', 'cybersigil-widgets@donza']

[org/gnome/shell/extensions/blur-my-shell/applications]
blur=false

[org/gnome/shell/extensions/blur-my-shell/lockscreen]
blur=true

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false

[org/gnome/shell/extensions/blur-my-shell/popup]
blur=true
brightness=0.45000000000000001
calendar-corner-radius=0
candidate-corner-radius=0
corner-radius=0
dialog-corner-radius=0
menu-corner-radius=0
notification-corner-radius=0
osd-corner-radius=0
osd-window-corner-radius=0
override-background=false
preserve-shell-theme=true
quick-settings-corner-radius=0
resize-popup-corner-radius=0
rounded-corners=3
sigma=30
static-blur=false
submenu-corner-radius=0

[org/gnome/shell/extensions/just-perfection]
animation=4
startup-status=0
support-notifier-type=0

